name: Generate Keystore

on:
  workflow_dispatch: # Manual trigger

jobs:
  generate_key:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -alias abdenour \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -keystore purrfectsnap.jks \
            -storepass abdenour \
            -keypass abdenour \
            -dname "CN=PurrfectSnap, OU=Dev, O=PurrfectSnap, L=Internet, S=NA, C=US"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Convert Keystore to Base64
        run: |
          base64 purrfectsnap.jks | tr -d '\n' > purrfectsnap.jks.b64
          echo "✅ Base64 encoded keystore saved to purrfectsnap.jks.b64"

      - name: Upload Keystore Files as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: purrfectsnap-keystore
          path: |
            purrfectsnap.jks
            purrfectsnap.jks.b64
