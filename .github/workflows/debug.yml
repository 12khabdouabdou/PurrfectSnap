name: PurrfectSnap Debug CI
on:
  workflow_dispatch:
  jobs:
  steps:
- name: Generate Keystore
        run: |
          keytool -genkeypair \
            -alias purrfectsnap \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -keystore purrfectsnap.jks \
            -storepass abdenour \
            -keypass abdenour \
            -dname "CN=PurrfectSnap, OU=Dev, O=PurrfectSnap, L=Internet, S=NA, C=US"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Convert Keystore to Base64
        run: |
          base64 -w 0 purrfectsnap.jks > keystore.txt
          echo "✅ Base64 encoded keystore saved to purrfectsnap.jks.b64"

      - name: Upload Keystore Files as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: purrfectsnap-keystore
          path: |
            purrfectsnap.jks
            purrfectsnap.txt
