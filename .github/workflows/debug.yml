name: PurrfectSnap Debug CI
on:
  push:
    branches:
      - dark-knight
    paths:
      - 'app/**'
      - 'core/**'
      - 'common/**'
      - 'native/**'
      - 'valdi/**'
      - 'mapper/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:
    inputs:
      ci_upload:
        description: 'Upload to CI channel'
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job_armv8:
    runs-on: ubuntu-latest
    outputs:
      armv8_apk: ${{ steps.upload_apk.outputs.artifact-paths }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Setup NPM Dependencies
        run: npm install typescript -g
      - name: Add Android targets for Rust
        run: rustup target add armv7-linux-androideabi aarch64-linux-android
      - name: Prepare release keystore for Gradle signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.PS_BASE_64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.PS_RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PS_RELEASE_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.PS_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_BASE64}" ] || [ -z "${SIGNING_KEY_ALIAS}" ] || [ -z "${SIGNING_STORE_PASSWORD}" ] || [ -z "${SIGNING_KEY_PASSWORD}" ]; then
            echo "Signing secrets are missing. Ensure PS_BASE_64, PS_RELEASE_KEY_ALIAS, PS_RELEASE_STORE_PASSWORD, PS_RELEASE_KEY_PASSWORD are set." >&2
            exit 1
          fi
          mkdir -p "${HOME}/.android"
          printf '%s' "${SIGNING_KEY_BASE64}" | base64 --decode > "${HOME}/.android/purrfectsnap-release.keystore"
          if [ ! -s "${HOME}/.android/purrfectsnap-release.keystore" ]; then
            echo "Decoded keystore is empty or invalid." >&2
            exit 1
          fi
          mkdir -p "${HOME}/.gradle"
          {
            echo "PS_RELEASE_STORE_PASSWORD=${SIGNING_STORE_PASSWORD}"
            echo "PS_RELEASE_KEY_ALIAS=${SIGNING_KEY_ALIAS}"
            echo "PS_RELEASE_KEY_PASSWORD=${SIGNING_KEY_PASSWORD}"
          } >> "${HOME}/.gradle/gradle.properties"
      - name: Build
        run: ./gradlew --configuration-cache assembleArmv8Debug
      - name: Determine the latest Build Tools version installed
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV
          echo "BUILD_TOOL_VERSION=$(ls "${SDK_ROOT}/build-tools/" | tail -n 1)" >> $GITHUB_ENV
      - name: Sign APK
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
          SIGNING_KEY_BASE64: ${{ secrets.PS_BASE_64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.PS_RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PS_RELEASE_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.PS_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_DIR="app/build/outputs/apk/armv8/debug"
          KEYSTORE_PATH="${SIGNING_DIR}/signingKey.jks"
          if [ -z "${SIGNING_KEY_BASE64}" ] || [ -z "${SIGNING_KEY_ALIAS}" ] || [ -z "${SIGNING_STORE_PASSWORD}" ] || [ -z "${SIGNING_KEY_PASSWORD}" ]; then
            echo "Signing secrets are missing. Ensure PS_BASE_64, PS_RELEASE_KEY_ALIAS, PS_RELEASE_STORE_PASSWORD, PS_RELEASE_KEY_PASSWORD are set." >&2
            exit 1
          fi
          printf '%s' "${SIGNING_KEY_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          if [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "Decoded keystore is empty or invalid." >&2
            exit 1
          fi
          APK_INPUT=$(ls "${SIGNING_DIR}"/*.apk | head -n 1)
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign" -v 4 "${APK_INPUT}" "${SIGNING_DIR}/purrfectsnap-armv8Debug-aligned.apk"
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" sign \
            --ks "${KEYSTORE_PATH}" \
            --ks-key-alias "${SIGNING_KEY_ALIAS}" \
            --ks-pass "pass:${SIGNING_STORE_PASSWORD}" \
            --key-pass "pass:${SIGNING_KEY_PASSWORD}" \
            --ks-type JKS \
            --out "${SIGNING_DIR}/purrfectsnap-armv8Debug-signed.apk" \
            "${SIGNING_DIR}/purrfectsnap-armv8Debug-aligned.apk"
      - name: Get current build version
        id: version-env
        run: |
          ./gradlew --configuration-cache getVersion
          echo "version=$(cat app/build/version.txt)" >> $GITHUB_ENV
      - name: Delete unsigned APK file and rename the signed one
        run: |
          find app/build/outputs/apk/armv8/debug/ -type f ! -name '*-signed*' -delete
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv app/build/outputs/apk/armv8/debug/purrfectsnap-armv8Debug-signed.apk app/build/outputs/apk/armv8/debug/purrfectsnap-${{ env.version }}-armv8-$SHORT_SHA.apk
      - name: Upload artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: purrfectsnap-armv8-debug
          path: app/build/outputs/apk/armv8/debug/*.apk
  job_armv7:
    runs-on: ubuntu-latest
    outputs:
      armv7_apk: ${{ steps.upload_apk.outputs.artifact-paths }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Setup NPM Dependencies
        run: npm install typescript -g
      - name: Add Android targets for Rust
        run: rustup target add armv7-linux-androideabi aarch64-linux-android
      - name: Prepare release keystore for Gradle signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.PS_BASE_64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.PS_RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PS_RELEASE_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.PS_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY_BASE64}" ] || [ -z "${SIGNING_KEY_ALIAS}" ] || [ -z "${SIGNING_STORE_PASSWORD}" ] || [ -z "${SIGNING_KEY_PASSWORD}" ]; then
            echo "Signing secrets are missing. Ensure PS_BASE_64, PS_RELEASE_KEY_ALIAS, PS_RELEASE_STORE_PASSWORD, PS_RELEASE_KEY_PASSWORD are set." >&2
            exit 1
          fi
          mkdir -p "${HOME}/.android"
          printf '%s' "${SIGNING_KEY_BASE64}" | base64 --decode > "${HOME}/.android/purrfectsnap-release.keystore"
          if [ ! -s "${HOME}/.android/purrfectsnap-release.keystore" ]; then
            echo "Decoded keystore is empty or invalid." >&2
            exit 1
          fi
          mkdir -p "${HOME}/.gradle"
          {
            echo "PS_RELEASE_STORE_PASSWORD=${SIGNING_STORE_PASSWORD}"
            echo "PS_RELEASE_KEY_ALIAS=${SIGNING_KEY_ALIAS}"
            echo "PS_RELEASE_KEY_PASSWORD=${SIGNING_KEY_PASSWORD}"
          } >> "${HOME}/.gradle/gradle.properties"
      - name: Build
        run: ./gradlew --configuration-cache assembleArmv7Debug
      - name: Determine the latest Build Tools version installed
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV
          echo "BUILD_TOOL_VERSION=$(ls "${SDK_ROOT}/build-tools/" | tail -n 1)" >> $GITHUB_ENV
      - name: Sign APK
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
          SIGNING_KEY_BASE64: ${{ secrets.PS_BASE_64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.PS_RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PS_RELEASE_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.PS_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_DIR="app/build/outputs/apk/armv7/debug"
          KEYSTORE_PATH="${SIGNING_DIR}/signingKey.jks"
          if [ -z "${SIGNING_KEY_BASE64}" ] || [ -z "${SIGNING_KEY_ALIAS}" ] || [ -z "${SIGNING_STORE_PASSWORD}" ] || [ -z "${SIGNING_KEY_PASSWORD}" ]; then
            echo "Signing secrets are missing. Ensure PS_BASE_64, PS_RELEASE_KEY_ALIAS, PS_RELEASE_STORE_PASSWORD, PS_RELEASE_KEY_PASSWORD are set." >&2
            exit 1
          fi
          printf '%s' "${SIGNING_KEY_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          if [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "Decoded keystore is empty or invalid." >&2
            exit 1
          fi
          APK_INPUT=$(ls "${SIGNING_DIR}"/*.apk | head -n 1)
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign" -v 4 "${APK_INPUT}" "${SIGNING_DIR}/purrfectsnap-armv7Debug-aligned.apk"
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" sign \
            --ks "${KEYSTORE_PATH}" \
            --ks-key-alias "${SIGNING_KEY_ALIAS}" \
            --ks-pass "pass:${SIGNING_STORE_PASSWORD}" \
            --key-pass "pass:${SIGNING_KEY_PASSWORD}" \
            --ks-type JKS \
            --out "${SIGNING_DIR}/purrfectsnap-armv7Debug-signed.apk" \
            "${SIGNING_DIR}/purrfectsnap-armv7Debug-aligned.apk"
      - name: Get current build version
        id: version-env
        run: |
          ./gradlew --configuration-cache getVersion
          echo "version=$(cat app/build/version.txt)" >> $GITHUB_ENV
      - name: Delete unsigned APK file and rename the signed one
        run: |
          find app/build/outputs/apk/armv7/debug/ -type f ! -name '*-signed*' -delete
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv app/build/outputs/apk/armv7/debug/purrfectsnap-armv7Debug-signed.apk app/build/outputs/apk/armv7/debug/purrfectsnap-${{ env.version }}-armv7-$SHORT_SHA.apk
      - name: Upload artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: purrfectsnap-armv7-debug
          path: app/build/outputs/apk/armv7/debug/*.apk

  notify:
    runs-on: ubuntu-latest
    needs: [job_armv8, job_armv7]
    if: always() && github.ref == 'refs/heads/dark-knight'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-apks
          merge-multiple: true
      - name: Dispatch Modernized Build Card to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_TO }}
        run: |
          sudo apt-get update && sudo apt-get install -y bc jq
          ./gradlew --configuration-cache getVersion || true
          VERSION_NAME=$(cat app/build/version.txt 2>/dev/null || echo "Unknown")
          
          if [[ "${{ needs.job_armv8.result }}" == "success" && "${{ needs.job_armv7.result }}" == "success" ]]; then
            BUILD_STATUS="✅ SUCCESS"
          else
            BUILD_STATUS="❌ FAILED"
          fi

          # --- Premium Logic Port ---
          GIT_HASH=$(git rev-parse --short HEAD)
          AUTHOR=$(git log -1 --pretty=%an)
          BRANCH_NAME="${{ github.ref_name }}"
          
          if [[ "$BRANCH_NAME" == "main" ]]; then
              BUILD_TYPE="💎 STABLE RELEASE"
          else
              BUILD_TYPE="🧪 PRE-RELEASE (BETA)"
          fi

          CHANGELOG=$(git log -n 5 --pretty=format:"• %s" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          ACTION_LINK="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          MESSAGE="<b>📱 PurrfectSnap | $BRANCH_NAME</b>\n━━━━━━━━━━━━━━━━\n📌 <b>Status:</b> $BUILD_STATUS\n🧪 <b>Type:</b> <code>$BUILD_TYPE</code>\n🆔 <b>Build:</b> <code>#$GIT_HASH</code>\n👤 <b>Author:</b> $AUTHOR\n━━━━━━━━━━━━━━━━\n📝 <b>Latest Commits:</b>\n$CHANGELOG\n━━━━━━━━━━━━━━━━\n📂 <b>Assets & Verification:</b>"

          # Discover APKs, calculate sizes/hashes, and handle mirrors
          for apk in $(find all-apks -name "*.apk" -type f); do
            FILENAME=$(basename "$apk")
            FILESIZE_BYTES=$(stat -c%s "$apk")
            FILESIZE_MB=$(echo "scale=1; $FILESIZE_BYTES / 1048576" | bc)
            SHA256_FULL=$(sha256sum "$apk" | awk '{ print $1 }')
            SHA256_SHORT=${SHA256_FULL:0:12}
            
            if [[ "$FILENAME" == *"armv8"* || "$FILENAME" == *"arm64"* ]]; then ARCH="ARMv8"; elif [[ "$FILENAME" == *"armv7"* ]]; then ARCH="ARMv7"; else ARCH="Universal"; fi
            
            # 1. Mirror: GoFile
            SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
            MIRROR_URL=""
            if [ "$SERVER" != "null" ] && [ -n "$SERVER" ]; then
                UPLOAD_RESP=$(curl -s -F "file=@$apk" "https://${SERVER}.gofile.io/uploadFile")
                MIRROR_URL=$(echo "$UPLOAD_RESP" | jq -r '.data.downloadPage')
            fi

            # 2. Mirror Fallback: Catbox
            if [ -z "$MIRROR_URL" ] || [ "$MIRROR_URL" == "null" ]; then
                MIRROR_URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@$apk" https://catbox.moe/user/api.php | tr -d '\r\n')
            fi

            MESSAGE="$MESSAGE\n📦 <b>$ARCH</b> ($FILESIZE_MB MB): <a href=\"$MIRROR_URL\">Download</a>\n<code>SHA256: $SHA256_SHORT</code>"
            
            # Direct Telegram Upload (if size < 50MB)
            if [ "$FILESIZE_BYTES" -lt 50000000 ]; then
                curl -s -F "chat_id=$TELEGRAM_CHAT_ID" -F "document=@$apk" -F "caption=📦 $ARCH Build (#$GIT_HASH)" -F "parse_mode=HTML" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" > /dev/null
            fi
          done

          MESSAGE="$MESSAGE\n━━━━━━━━━━━━━━━━\n🛠 <a href=\"$ACTION_LINK\">View GitHub Action</a>"

          # Final Dispatch
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$(echo -e "$MESSAGE")" -d "parse_mode=HTML" -d "disable_web_page_preview=true"
