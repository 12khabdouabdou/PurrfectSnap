name: Build APK (work-kaladin)

on:
  push:
    branches: [work-kaladin]
  workflow_dispatch:

jobs:
  build_armv8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup NPM dependencies
        run: npm install typescript -g

      - name: Add Android target for Rust
        run: rustup target add aarch64-linux-android

      - name: Build armv8 debug APK
        run: ./gradlew --configuration-cache assembleArmv8Debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: purrfect-armv8-debug
          path: app/build/outputs/apk/armv8/debug/*.apk
          if-no-files-found: error